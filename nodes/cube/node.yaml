version: 1

name: cube
namespace: enzo
label: Cube
tags: [primitive, surface, polygon]

outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: cube

parameters:
  - name: size
    label: Size
    type: float
    size: 3
    default: 1
    range: {min: 0, max: 100}
    style: xyz

  - name: center
    label: Center
    type: float
    size: 3
    default: 0
    style: xyz

  - name: rotate
    label: Rotation
    type: float
    size: 3
    default: 0
    range: {min: -360, max: 360}
    style: xyz

  - name: uniformScale
    label: Uniform Scale
    type: float
    default: 1
    range: {min: 0, max: 10}
