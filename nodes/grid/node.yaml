version: 1

name: grid
namespace: enzo
label: Grid
tags: [primitive, surface, polygon]

outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: grid

parameters:
  - name: size
    label: Size
    type: float
    size: 2
    default: 10
    range: {min: 0, max: 100}
    style: xyz

  - name: rows
    label: Rows
    type: int
    default: 10
    range: {min: 1, max: 100, minLocked: true}

  - name: columns
    label: Columns
    type: int
    default: 10
    range: {min: 1, max: 100, minLocked: true}
