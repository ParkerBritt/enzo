version: 1

name: circle
namespace: enzo
label: Circle
tags: [primitive, curve, 2d]

outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: circle

parameters:
  - name: placement_divider
    label: Placement
    type: divider
    icon: axis-3d

  - name: orientation
    label: Orientation
    type: dropdown
    default: zx
    options:
      - {value: xy, label: XY Plane}
      - {value: yz, label: YZ Plane}
      - {value: zx, label: ZX Plane}

  - name: center
    label: Center
    type: float
    size: 3
    default: 0
    range: {min: -10, max: 10}
    style: xyz

  - name: rotate
    label: Rotate
    type: float
    size: 3
    default: 0
    range: {min: -360, max: 360}
    style: xyz

  - name: dimensions_divider
    label: Dimensions
    type: divider
    icon: scaling

  - name: uniform_scale
    label: Uniform Scale
    type: float
    default: 1
    range: {min: 0, max: 10}

  - name: radius
    label: Radius
    type: float
    size: 2
    default: 1
    range: {min: 0, max: 10}
    style: xyz

  - name: divisions_divider
    label: Divisions
    type: divider
    icon: spline

  - name: divisions
    label: Divisions
    type: int
    default: 10
    range: {min: 1, max: 100, minLocked: true}

  - name: arc
    label: Arc
    type: dropdown
    options:
      - {value: closed, label: Closed}
      - {value: open_arc, label: Open Arc}
      - {value: closed_arc, label: Closed Arc}
      - {value: sliced_arc, label: Sliced Arc}

  - name: arc_angles
    label: Arc Angles
    type: float
    size: 2
    default: [0, 360]
    labelHidden: true
    range: {min: 0, max: 360, minLocked: true}
    hideCondition: arc == 0
    style: rangeCircle
    styleOptions:
      ordered: true
      caption: arc
