version: 1

name: sineWave
namespace: enzo
label: Sine Wave
tags: [deform, displace]

inputs:
  min: 1
  max: 1
outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: sineWave

parameters:
  - name: radial
    label: Radial Mode
    type: bool

  - name: center
    label: Center
    type: xyz
    size: 3

  - name: frequency
    label: Frequency
    type: float
    default: 1

  - name: offset
    label: Offset
    type: float
    default: 0

  - name: amplitude
    label: Amplitude
    type: ramp
    default: 2
