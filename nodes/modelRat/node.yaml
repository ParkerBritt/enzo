version: 1

name: modelRat
namespace: enzo
label: "Model: Rat"
tags: [model, test, animal]

outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: modelRat

parameters:
  - name: detail
    label: Detail
    type: dropdown
    default: simple
    options:
      - value: simple
        label: Simple
      - value: complex
        label: Complex

  - name: translate
    label: Translate
    type: float
    size: 3
    style: xyz
    tooltip: How far to move along each axis.

  - name: rotate
    label: Rotate
    type: float
    size: 3
    style: xyz
    range: {min: -360, max: 360}
    tooltip: How far to turn about each axis, in degrees.

  - name: scale
    label: Scale
    type: float
    size: 3
    default: 1
    style: xyz
    tooltip: How much to grow or shrink along each axis.

  - name: uniform_scale
    label: Uniform Scale
    type: float
    default: 1
    tooltip: How much to grow or shrink along every axis at once.
