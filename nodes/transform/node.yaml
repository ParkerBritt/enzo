version: 1

name: transform
namespace: enzo
label: Transform
tags: [transform, utility]

inputs:
  - label: Geometry
outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: transform

icon: icon.svg

parameters:
  - name: selection
    label: Selection
    type: string
    tooltip: >
      The points to transform. Accepts a point selection or a group name. Leave
      it empty to transform everything.

  - name: transform_order
    label: Transform Order
    type: dropdown
    default: srt
    tooltip: >
      The order a point passes through the scale, the rotation, and the
      translation. Scale Rotate Translate turns the points around the pivot
      before moving them, while Translate Rotate Scale swings the moved points
      around the pivot.
    options:
      - value: srt
        label: Scale Rotate Translate
      - value: str
        label: Scale Translate Rotate
      - value: rst
        label: Rotate Scale Translate
      - value: rts
        label: Rotate Translate Scale
      - value: tsr
        label: Translate Scale Rotate
      - value: trs
        label: Translate Rotate Scale

  - name: translate
    label: Translate
    type: float
    size: 3
    style: xyz
    tooltip: How far to move along each axis.

  - name: rotate
    label: Rotate
    type: float
    size: 3
    style: xyz
    range: {min: -360, max: 360}
    tooltip: How far to turn about each axis, in degrees.

  - name: scale
    label: Scale
    type: float
    size: 3
    default: 1
    style: xyz
    tooltip: How much to grow or shrink along each axis.

  - name: uniform_scale
    label: Uniform Scale
    type: float
    default: 1
    tooltip: How much to grow or shrink along every axis at once.

  - name: pivot
    label: Pivot
    type: float
    size: 3
    style: xyz
    tooltip: The point that rotation and scale happen around.

  - name: pivot_rotate
    label: Pivot Rotate
    type: float
    size: 3
    style: xyz
    range:
      min: -360
      max: 360
    tooltip: >
      How far to turn the axes that rotation and scale work along, in degrees.
