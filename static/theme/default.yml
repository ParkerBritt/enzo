# The theme Enzo ships with. It defines every token, so a user theme only carries
# the values it changes and falls back to the rest.

name: Enzo

# The palette the settings theme page lists, section by section. A variable left
# out here is derived from the ones above it and is only edited in the file.
palette:
  Surfaces:
    background:    Background
    fieldSurface:  Field surface
    surfaceHeader: Header surface
    surface:       Panel surface
    surfacePanel:  Floating panel
    surfaceRaised: Raised surface
    selectedFill:  Selected fill
  Borders:
    borderSoft:  Soft border
    fieldBorder: Field border
    border:      Panel border
  Text:
    textStrong: Strong text
    text:       Body text
    textLabel:  Label text
    textMuted:  Muted text
    textFaint:  Faint text
  Accent:
    accent:       Accent
    accentBright: Accent, bright
  Feedback:
    danger:        Danger
    success:       Success
    warning:       Warning
    warningBright: Warning, bright
  Axes:
    axisX:      X axis
    axisXLight: X axis, light
    axisY:      Y axis
    axisYLight: Y axis, light
    axisZ:      Z axis
    axisZLight: Z axis, light
  Type:
    fontSans: Interface font
    fontMono: Data font
  Shape:
    panelRadius: Panel radius

variables:
  # Surfaces, darkest to lightest
  background:    "#0a0a0d"
  fieldSurface:  "#0d0d11"
  surfaceHeader: "#101015"
  surface:       "#141418"
  surfacePanel:  "#17171c"
  surfaceRaised: "#191920"

  # Fill behind a selected row or an active parameter value, a touch lighter
  # than the field surface
  selectedFill: "#2e2e38"

  # Borders
  borderSoft:  "#1d1d25"
  fieldBorder: "#242430"
  border:      "#262630"

  # Text, brightest to dimmest
  textStrong: "#f6f6f9"
  text:       "#e7e8ec"
  textLabel:  "#9a9aa6"
  textMuted:  "#63636d"
  textFaint:  "#3a3a42"

  # Fonts
  fontSans: "Public Sans"
  fontMono: "Inconsolata"

  # Accent
  accent:       "#8b5cf6"
  accentBright: "#a78bfa"
  accentDim:    $accent @ 0.15
  accentLine:   $accent @ 0.45

  # Fill that marks a parameter's value, such as the bar in a slider
  parameter: $selectedFill

  # Destructive actions, such as deleting a point
  danger: "#c98d92"

  # Feedback states
  warning:       "#d97706"
  warningBright: "#f59e0b"
  success:       "#7CCF7D"

  # Axes
  axisX:      "#f5685f"
  axisY:      "#46c98a"
  axisZ:      "#4ea1ff"
  axisXLight: "#f1857d"
  axisYLight: "#7fd3a6"
  axisZLight: "#7fb4f2"

  # Shape
  panelRadius: 13

components:
  menu:
    barColor: "#0e0e12"
  network:
    dotColor: "#1e1e26"
    # The box dragged across the canvas to select nodes.
    selectionColor:       $accentDim
    selectionBorderColor: $accentLine
    selectionRadius:      4
  node:
    bodyColor:        "#272834"
    borderColor:      "#3d3d4c"
    portColor:        "#4a4a54"
    displayFlagColor: "#4ea1ff"
  nodeLink:
    inactiveColor: "#3a3a46"
    activeColor:   "#59596b"
    cutColor:      "#f5685f"
    redirectColor: "#59596b"
  spreadsheet:
    backgroundColor: $fieldSurface
    lineColor:       $fieldBorder
    selectedRowColor: $selectedFill
    # Colours per attribute owner, indexed Points Vertices Faces Primitive Node
    attributeOwnerColors:
      - "#4ea1ff"
      - "#f0a93b"
      - "#46c98a"
      - "#f5685f"
      - "#b69bf2"
  parameter:
    # The floating panel container, translucent over the network behind it.
    panelColor:      $surfacePanel
    # The inset fields inside it, such as sliders and text boxes.
    backgroundColor: $fieldSurface
    lineColor:       $fieldBorder
    borderRadius:    10
    panelHeight:     420
  slider:
    fillColor: $parameter
  rangeDial:
    # The ring
    trackColor: $fieldSurface
    edgeColor:  $fieldBorder
    arcColor:   $parameter
    tickColor:  $textFaint
    # The two handles
    handleColor:      "#c8c8d2"
    handleHoverColor: $textStrong
  codeEditor:
    backgroundColor:   $background
    gutterBorderColor: $borderSoft
    gutterTextColor:   $textFaint
  expression:
    # A component driven by a formula instead of a literal, tinted in the accent
    backgroundColor:      $accent @ 0.06
    borderColor:          $accent @ 0.35
    barColor:             $accent
    badgeColor:           $accentBright
    badgeBackgroundColor: $accent @ 0.18
    codeColor:            $textLabel
    resultColor:          $success
    # A formula that failed to evaluate, falls back to the type default
    invalidBackgroundColor: $warning @ 0.06
    invalidBorderColor:     $warning @ 0.35
    invalidBarColor:        $warning
    invalidResultColor:     $warningBright
  iconButton:
    # Surfaces per button variant, at rest and under the cursor.
    plainHoverColor:  $borderSoft
    fieldColor:       $fieldSurface
    fieldHoverColor:  $surfaceRaised
    accentColor:      $accent
    accentHoverColor: $accentBright
  ramp:
    plotColor:     $fieldSurface
    lineColor:     $fieldBorder
    curveColor:    $accentBright
    fillColor:     $accent @ 0.25
    pointColor:    "#8a8a94"
    selectedColor: $accentBright
  timeline:
    # The frame scale and its ticks
    baselineColor:  $border
    frameTickColor: $fieldBorder
    minorTickColor: $selectedFill
    majorTickColor: "#45454f"
    # The play button
    playColor:      $parameter
    playHoverColor: $textFaint
    # The marker on the current frame
    playheadColor: $accent
  toggle:
    onColor: $parameter
  popup:
    highlightColor: $accentDim
  tooltip:
    backgroundColor: $surfaceRaised
    borderColor:     $border
    textColor:       $text
    delay:           500
  primitivesTree:
    selectedColor: $accentBright
  tabMenu:
    highlightColor:   $accentDim
    focusBorderColor: $accentLine
  viewport:
    # The radial background gradient, from its bright centre through the base
    # colour out to the dark edge.
    backgroundColor: "#101015"
    gradientCenter:  "#191920"
    gradientEdge:    "#0b0b0f"
    # Flat shading colour of the display geometry.
    geometryColor:   "#a8a8b8"
