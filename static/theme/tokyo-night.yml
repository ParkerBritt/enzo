# A theme in the Tokyo Night palette. It carries only the values it changes and
# falls back to the default theme for the rest.

name: Tokyo Night

variables:
  # Surfaces, darkest to lightest
  background:    "#121219"
  fieldSurface:  "#16161e"
  surfaceHeader: "#16161e"
  surface:       "#1a1b26"
  surfaceRaised: "#1c1d29"

  # The lightest neutral fill, behind a selected row and on a node body
  selectedFill: "#292e42"

  # Lines, from the faintest divider to the brightest stroke
  borderSoft: "#24293d"
  border:     "#292e42"
  line:       "#3b4261"
  lineBright: "#545c7e"
  gridDot:    "#222433"

  # Text, brightest to dimmest
  textStrong: "#c0caf5"
  text:       "#a9b1d6"
  textLabel:  "#737aa2"
  textMuted:  "#565f89"
  textFaint:  "#3b4261"

  # Accent
  accent:       "#7aa2f7"
  accentBright: "#7dcfff"

  # Fill that marks a value, such as the bar in a slider
  valueFill: "#292e42"

  # The grip a value is dragged by
  handle: "#c0caf5"

  # Destructive actions, such as deleting a point
  danger: "#f7768e"

  # Feedback states
  warning:       "#e0af68"
  warningBright: "#ff9e64"
  success:       "#9ece6a"

  # Axes
  axisX:      "#f7768e"
  axisY:      "#9ece6a"
  axisZ:      "#7aa2f7"
  axisXLight: "#f99bab"
  axisYLight: "#b9dd96"
  axisZLight: "#a3bdf9"

components:
  node:
    displayFlagColor: "#7dcfff"
